# Render Blueprint: New > Blueprint > pick this repo. Secrets are entered in the
# dashboard (sync: false). Ingest into Qdrant Cloud from your machine first.
services:
  - type: web
    name: nestora-assistant
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_API_KEY
        sync: false
      - key: EMBED_PROVIDER
        value: openai
      - key: EMBED_MODEL
        value: gemini-embedding-001
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
